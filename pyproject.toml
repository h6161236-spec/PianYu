[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pianyu"
version = "0.1.0"
description = "Windows desktop tool for importing PPT, generating bilingual voiceover scripts, and exporting narrated slide videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "PySide6>=6.8",
    "python-pptx>=1.0",
]
authors = [{ name = "OpenAI Codex" }]
keywords = ["ppt", "desktop", "translation", "tts", "voiceover"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1", "opencc-python-reimplemented>=0.1.7"]
release = ["pyinstaller>=6.0"]
dev = ["pytest>=8.3"]

[project.scripts]
pianyu = "vcut_studio.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
