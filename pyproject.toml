[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcut-studio"
version = "0.1.0"
description = "Windows desktop scaffold for video cleanup, subtitle translation, and English dubbing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]
authors = [{ name = "OpenAI Codex" }]
keywords = ["video", "desktop", "translation", "dubbing", "editing"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1", "opencc-python-reimplemented>=0.1.7"]
release = ["pyinstaller>=6.0"]
dev = ["pytest>=8.3"]

[project.scripts]
vcut-studio = "vcut_studio.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
